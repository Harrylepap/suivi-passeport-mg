name: Relevé des annonces

# Déclenché à 11 h et 19 h, heure de Paris, par la tâche planifiée du Worker Cloudflare,
# ou à la main depuis l'onglet Actions. Le cron de GitHub, retardé de plusieurs heures, n'est plus utilisé.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: releve
  cancel-in-progress: false

jobs:
  releve:
    name: Relevé et diffusion
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Installer Tesseract, avec cache
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: tesseract-ocr
          version: "1"
      - name: Installer les dépendances
        run: pip install -q -r requirements.txt
      - name: Relever les annonces et diffuser les nouvelles
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check.py
      - name: Enregistrer la base
        if: always()
        run: |
          git add annonces.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Nouvelles annonces"
          git push
      - name: Alerter en cas d'échec
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Le relevé des annonces a échoué : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
