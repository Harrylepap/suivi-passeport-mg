name: Relevé des annonces

on:
  schedule:
    - cron: "7 9 * * *"
    - cron: "7 10 * * *"
    - cron: "7 17 * * *"
    - cron: "7 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: releve
  cancel-in-progress: false

jobs:
  heure:
    name: Garde 11 h et 19 h, heure de Paris
    runs-on: ubuntu-24.04
    outputs:
      ok: ${{ steps.h.outputs.ok }}
    steps:
      - id: h
        env:
          CRENEAU: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          heure_utc=$(echo "$CRENEAU" | awk '{print $2}')
          heure_paris=$(TZ=Europe/Paris date -d "$(date -u +%Y-%m-%d) ${heure_utc}:00 UTC" +%H)
          echo "Créneau $heure_utc h UTC, soit $heure_paris h à Paris"
          if [ "$heure_paris" = "11" ] || [ "$heure_paris" = "19" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

  releve:
    name: Relevé et diffusion
    needs: heure
    if: needs.heure.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Installer Tesseract et les dépendances
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tesseract-ocr
          pip install -q -r requirements.txt
      - name: Relever les annonces et diffuser les nouvelles
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check.py
      - name: Enregistrer la base
        if: always()
        run: |
          git add annonces.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Nouvelles annonces"
          git push
      - name: Alerter en cas d'échec
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Le relevé des annonces a échoué : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
