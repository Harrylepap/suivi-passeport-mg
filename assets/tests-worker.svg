<text x="24" y="70" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#8B949E">$ <tspan fill="#E6EDF3">npm test</tspan></text>
<text x="24" y="105" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#3FB950" xml:space="preserve">✔ le webhook refuse un appel sans le secret de Telegram</text>
<text x="24" y="127" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#3FB950" xml:space="preserve">✔ /start envoie l&#x27;accueil et abonne la personne</text>
<text x="24" y="149" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#3FB950" xml:space="preserve">✔ l&#x27;accueil ne prétend pas que les données sont anonymes</text>
<text x="24" y="171" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#3FB950" xml:space="preserve">✔ /confidentialite décrit les données réellement enregistrées</text>
<text x="24" y="193" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#3FB950" xml:space="preserve">✔ l&#x27;identité de la personne est enregistrée</text>
<text x="24" y="215" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#3FB950" xml:space="preserve">✔ l&#x27;événement est rattaché à l&#x27;identifiant réel de la conversation</text>
<text x="24" y="237" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#3FB950" xml:space="preserve">✔ un numéro publié renvoie l&#x27;affiche de sa liste</text>
<text x="24" y="259" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#3FB950" xml:space="preserve">✔ un numéro non publié est mis en suivi</text>
<text x="24" y="281" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#3FB950" xml:space="preserve">✔ un numéro court est trouvé mais jamais mis en suivi</text>
<text x="24" y="303" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#3FB950" xml:space="preserve">✔ le suivi est limité à cinq numéros</text>
<text x="24" y="325" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#3FB950" xml:space="preserve">✔ /stop désabonne et efface les données de la personne</text>
<text x="24" y="347" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#3FB950" xml:space="preserve">✔ le bot n&#x27;expose aucune commande de statistiques</text>
<text x="24" y="369" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#3FB950" xml:space="preserve">✔ la purge efface les personnes inactives et les prévient</text>
<text x="24" y="391" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#3FB950" xml:space="preserve">✔ la politique de confidentialité donne un contact</text>
<text x="24" y="413" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#3FB950" xml:space="preserve">✔ les routes d&#x27;administration exigent le secret</text>
<text x="24" y="435" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#E6EDF3" xml:space="preserve"></text>
